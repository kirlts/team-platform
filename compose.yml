# team-platform: un servicio, un volumen (MASTER-SPEC §4.5).
services:
  team-platform:
    build: .
    image: team-platform:local
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    ports:
      # Sólo loopback: el TLS y el acceso público los pone el proxy del anfitrión.
      - "127.0.0.1:${PUBLISH_PORT:-3000}:3000"
    volumes:
      - team-data:/data
    # stop_grace_period: sin definir, queda la omisión de Docker (10 s; informe 03).

volumes:
  team-data:
