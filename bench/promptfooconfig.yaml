# team-platform reference bench (MASTER-SPEC §7.11).
# One provider, one case per test, one assertion that imports bench/score.js.
# Usage: npm run eval (from bench/). The promptfoo version is pinned in bench/package.json.
description: MECE decomposition of the bench inputs

prompts:
  - "{{case}}"   # the provider ignores the text and reads the case by its id

providers:
  - id: file://provider.mjs
    label: fake-analyzer
    config:
      providers: fake
      mode: perfect
  # Real providers from src/providers, with the keys in the environment (TEXT_PROVIDER, ANTHROPIC_API_KEY, ...):
  # - id: file://provider.mjs
  #   label: api-analyzer
  #   config:
  #     providers: real

defaultTest:
  assert:
    - type: javascript
      value: file://assert.mjs

tests:
  - description: 01-chat-grupo
    vars:
      case: 01-chat-grupo
  - description: 02-docx-40-puntos
    vars:
      case: 02-docx-40-puntos
  - description: 03-monologo-prueba
    vars:
      case: 03-monologo-prueba
  - description: 04-reporte-de-error
    vars:
      case: 04-reporte-de-error
  - description: 05-idea-suelta
    vars:
      case: 05-idea-suelta
  - description: 06-mensaje-mezclado
    vars:
      case: 06-mensaje-mezclado
  - description: 07-video-de-pantalla
    vars:
      case: 07-video-de-pantalla
