# Adds team-platform to the compose file of an existing project.
#
#   docker build -t team-platform:local /path/to/team-platform
#   cp /path/to/team-platform/.env.example team-platform.env     # and fill in
#   docker compose -f compose.yml -f /path/to/team-platform/compose.override.example.yml up -d
#
# The service ends up on the project's default network, reachable from the other
# services as http://team-platform:3000. It publishes no port on the host.
# If the project's compose file is not called compose.yml, change the first -f.
services:
  team-platform:
    image: team-platform:local
    restart: unless-stopped
    env_file: ./team-platform.env
    environment:
      DATA_DIR: /data
    expose:
      - "3000"
    volumes:
      - team-platform-data:/data

volumes:
  team-platform-data:
