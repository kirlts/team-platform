# Agrega team-platform al compose de un proyecto existente.
#
#   docker build -t team-platform:local /ruta/a/team-platform
#   cp /ruta/a/team-platform/.env.example team-platform.env     # y completar
#   docker compose -f compose.yml -f /ruta/a/team-platform/compose.override.example.yml up -d
#
# El servicio queda en la red por omisión del proyecto, alcanzable desde los demás
# servicios como http://team-platform:3000. No publica ningún puerto en el anfitrión.
# Si el compose del proyecto no se llama compose.yml, se cambia el primer -f.
services:
  team-platform:
    image: team-platform:local
    restart: unless-stopped
    env_file: ./team-platform.env
    environment:
      DATA_DIR: /data
    expose:
      - "3000"
    volumes:
      - team-platform-data:/data

volumes:
  team-platform-data:
