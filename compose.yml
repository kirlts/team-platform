# team-platform: one service, one volume (MASTER-SPEC §4.5).
services:
  team-platform:
    build: .
    # IMAGE_TAG: a second instance on the same host sets its own tag, or its build would move the tag the first one uses.
    image: ${IMAGE_TAG:-team-platform:local}
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    ports:
      # Loopback only: TLS and public access are provided by the host's proxy.
      - "127.0.0.1:${PUBLISH_PORT:-3000}:3000"
    volumes:
      - team-data:/data
    # stop_grace_period: left undefined, so Docker's default applies (10 s; report 03).

volumes:
  team-data:
